<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        table {
            width: 100%;
            border-spacing: 10px;
        }
        td {
            padding: 8px;
            vertical-align: top;
        }
        label {
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
            color: #555;
        }
        select, input[type="number"], button {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #555;
        }
        .linkedin-link {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        .linkedin-link img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }
        .linkedin-link a {
            text-decoration: none;
            font-weight: bold;
            color: #0077b5;
        }
    </style>
</head>
<body>
    <h1>Student Performance Prediction</h1>
    <form action="{{ url_for('predict') }}" method="post">
        <table>
            <tr>
                <td>
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </td>
                <td>
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required min="10" max="20">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="grade_level">Grade Level:</label>
                    <select id="grade_level" name="grade_level" required>
                        <option value="9th">9th</option>
                        <option value="10th">10th</option>
                        <option value="11th">11th</option>
                        <option value="12th">12th</option>
                    </select>
                </td>
                <td>
                    <label for="attendance">Attendance (%):</label>
                    <input type="number" id="attendance" name="attendance" required min="0" max="100">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="study_hours">Hours Studied Weekly:</label>
                    <input type="number" id="study_hours" name="study_hours" required min="0" max="40">
                </td>
                <td>
                    <label for="parent_education">Parental Education Level:</label>
                    <select id="parent_education" name="parent_education" required>
                        <option value="High School">High School</option>
                        <option value="Bachelor's">Bachelor's</option>
                        <option value="Master's">Master's</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="income">Household Income:</label>
                    <select id="income" name="income" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </td>
                <td>
                    <label for="prev_grade">Previous Year Grade:</label>
                    <select id="prev_grade" name="prev_grade" required>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="extracurriculars">Participation in Extracurriculars:</label>
                    <select id="extracurriculars" name="extracurriculars" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </td>
                <td>
                    <label for="health_status">Health Status:</label>
                    <select id="health_status" name="health_status" required>
                        <option value="Good">Good</option>
                        <option value="Average">Average</option>
                        <option value="Poor">Poor</option>
                    </select>
                </td>
            </tr>
        </table>
        <button type="submit">Predict</button>
    </form>
    <footer>
        <p>Done by Malyavantham Radha Krishna Deekshith</p>
        <div class="linkedin-link">
            <a href="https://www.linkedin.com/in/radha-krishna-malyavantham/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg" alt="LinkedIn Logo">
                Visit my LinkedIn
            </a>
        </div>
    </footer>
</body>
</html>
